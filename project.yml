name: Pomodoro
options:
  bundleIdPrefix: com.drean
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Pomodoro:
    type: application
    platform: macOS
    sources:
      - Pomodoro
    settings:
      base:
        PRODUCT_NAME: Pomodoro
        PRODUCT_BUNDLE_IDENTIFIER: com.drean.pomodoro
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        INFOPLIST_FILE: Pomodoro/Info.plist
        LSUIElement: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
